services:
  server:
    build: .
    command: server
    ports:
      - "3000:3000"
    environment:
      - FLEET_API_ADDR=0.0.0.0:3000
      - RUST_LOG=info

  agent-1:
    build: .
    command: agent
    depends_on:
      - server
    environment:
      - FLEET_API_URL=http://server:3000
      - FLEET_AGENT_NAME=agent-1
      - RUST_LOG=info
    restart: on-failure

  agent-2:
    build: .
    command: agent
    depends_on:
      - server
    environment:
      - FLEET_API_URL=http://server:3000
      - FLEET_AGENT_NAME=agent-2
      - RUST_LOG=info
    restart: on-failure

  agent-3:
    build: .
    command: agent
    depends_on:
      - server
    environment:
      - FLEET_API_URL=http://server:3000
      - FLEET_AGENT_NAME=agent-3
      - RUST_LOG=info
    restart: on-failure
